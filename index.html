<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITリテラシー 第5回｜SNS・ネット防衛 確認テスト</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#18283a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(120deg,#101e35,#174b62);color:white;padding:34px 20px}.wrap{max-width:850px;margin:auto}.eyebrow{color:#75f5d9;font-weight:700;letter-spacing:.1em}h1{font-size:clamp(24px,5vw,35px);margin:10px 0}p{line-height:1.7}.meta{color:#d6e6f0}.toolbar{position:sticky;top:0;background:#fff;border-bottom:1px solid #dce5ee;z-index:3;padding:12px 20px;box-shadow:0 2px 8px #12233a12}.progress{height:9px;background:#e4edf4;border-radius:10px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#00a98e;transition:width .2s}.content{padding:22px 16px 55px}.question{background:white;border:1px solid #dce5ee;border-radius:15px;padding:22px;margin-bottom:18px;box-shadow:0 3px 14px #14253b09}.num{font-size:13px;color:#167e79;font-weight:800}.question h2{font-size:18px;line-height:1.6;margin:8px 0 17px}.option{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid #d9e2eb;border-radius:10px;margin:9px 0;cursor:pointer;line-height:1.5}.option:has(input:checked){background:#e6faf5;border-color:#159b85}.option input{margin-top:4px;accent-color:#008f7b;flex-shrink:0}.actions{text-align:center;margin:28px 0}.btn{background:#087f72;color:#fff;border:0;padding:15px 35px;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;min-height:48px}.btn.secondary{background:#334b61;margin-left:8px}.btn:disabled{opacity:.5;cursor:not-allowed}.hint{color:#596b7b;font-size:14px}.result{background:white;border:2px solid #0e9a85;border-radius:17px;padding:26px;margin:25px 0}.score{font-size:46px;font-weight:850;color:#087f72}.review{padding:15px;margin:13px 0;border-radius:10px;background:#f2f6f9;border-left:5px solid #d65a4e}.review.correct{border-left-color:#0a987c}.review p{margin:7px 0}.review strong{color:#0e3852}.hidden{display:none}.footer{text-align:center;color:#64748b;font-size:13px;margin-top:25px}@media print{.hero,.toolbar,.actions{display:none!important}.question{break-inside:avoid;box-shadow:none}.result{break-inside:avoid}} </style></head><body><header class="hero"><div class="wrap"><div class="eyebrow">第5回 ITリテラシー</div><h1>SNS・ネット防衛 確認テスト</h1><p class="meta">SNSの違法行為とトラブル ／ 全20問・4択 ／ 1問5点・100点満点</p><p>各問題で最も適切な答えを1つ選んでください。最後に採点すると、正解と解説を確認できます。</p></div></header><div class="toolbar"><div class="wrap"><div id="count" aria-live="polite">回答済み 0 / 20問</div><div class="progress"><div class="bar" id="bar"></div></div></div></div><main class="wrap content"><div id="questions"></div><div class="actions"><p id="notice" class="hint">20問すべて回答すると採点できます。</p><button id="grade" class="btn" disabled>採点する・正解を見る</button><button id="retry" class="btn secondary hidden">もう一度挑戦</button></div><section id="result" class="result hidden" aria-live="polite"></section><p class="footer">授業資料「SNSトラブルとネット防衛ガイド」に基づく学習用テスト。法律上の判断は具体的な事情により異なります。</p></main><script>
const quiz=[
['熊本地震の際に「動物園からライオンが逃げた」というウソの投稿をした事件で、投稿者が逮捕された疑いは？',['窃盗罪','偽計業務妨害罪','器物損壊罪','不正アクセス禁止法違反'],1,'ウソの情報によって関係機関の業務を妨害したとして、偽計業務妨害の疑いで逮捕されました。'],
['「冗談で投稿しただけ」という説明について、最も適切なのは？',['冗談なら必ず無罪になる','削除すれば必ず責任はなくなる','冗談でも内容や影響によって法的責任を問われる','フォロワーが少なければ何を書いてもよい'],2,'冗談や軽い気持ちでも、投稿の内容と結果によっては法的責任が生じます。'],
['ラーメン店について、実際に食べた感想として比較的適切な投稿は？',['この店は犯罪組織だ','この料理は私には辛すぎた','腐った食材を使っていると断定する','みんなで店を攻撃しよう'],1,'自分の体験に基づく感想は原則として表現できます。ただし表現方法には注意が必要です。'],
['根拠がないのに「あの店は腐った食材を使っている」と広めると、どのようなリスクがある？',['信用毀損や業務妨害の問題','必ず著作権の問題だけになる','ネット上なら法律と無関係','投稿した本人には責任がない'],0,'虚偽の情報で店の信用を傷つけたり業務を妨げたりすると、犯罪や損害賠償の問題になり得ます。'],
['他人の顔写真と実名を無断でSNSに公開する行為で問題となり得るものは？',['肖像権・プライバシー侵害','必ず特許権侵害','何も問題ない','必ず交通違反'],0,'本人の同意のない顔写真・実名の公開は、肖像権やプライバシーの侵害などにつながり得ます。'],
['匿名アカウントで悪質な投稿をした場合、正しい説明は？',['匿名なら絶対に特定されない','鍵付きなら何を書いてもよい','法的手続きによって発信者が特定される場合がある','投稿を削除すれば特定できない'],2,'匿名や鍵付きのアカウントでも、一定の法的手続きを通じて発信者情報が開示される場合があります。'],
['刑事事件と民事事件の違いとして適切なのは？',['刑事は損害賠償だけを扱う','民事では必ず逮捕される','どちらも同じ手続き','刑事は犯罪への処罰、民事は損害賠償などが中心'],3,'刑事責任と民事責任は別で、同じ行為について両方が問題になることもあります。'],
['好きなアイドルの公式写真を、許可なくSNSのアイコンに使う場合は？',['公式写真なら必ず自由に使える','著作権や肖像権などに注意が必要','非公開アカウントなら絶対に合法','有名人には権利がない'],1,'公式写真にも著作権などの権利があります。利用条件や許諾の有無を確認しましょう。'],
['購入した漫画を全ページ撮影してSNSに公開することについて正しいのは？',['購入したので自由に公開できる','友達だけに見せるなら必ず合法','著作権侵害となり得る','出典を書けば必ず問題ない'],2,'漫画を購入しても、作品をインターネット上で無断公開する権利まで得られるわけではありません。'],
['海賊版と知りながら漫画をダウンロードする行為は？',['自分で読むだけなら必ず合法','条件によっては私的利用でも違法になる','ダウンロードなら著作権は関係ない','友達が勧めれば合法'],1,'違法にアップロードされた作品と知りながらダウンロードする行為は、一定の要件のもとで違法になります。'],
['他人の文章を「引用」する際に重要な条件は？',['出典だけ書けば全文転載できる','引用箇所を区別せず自分の文章として書く','自分の文章を中心に、必要な範囲を区別して使い出典を示す','引用するなら著者名を消す'],2,'引用には必要性、主従関係、明確な区別、必要な範囲、出典の明示などが重要です。'],
['「日給5万円、荷物を受け取って運ぶだけ」というSNS募集で警戒すべき理由は？',['必ず公務員の募集だから','高額報酬と仕事内容の不透明さが犯罪への加担を示す可能性','学生向けなので安全だから','即日払いなら安全だから'],1,'異常に高い報酬や曖昧な仕事内容は、詐欺などの実行役に誘い込む危険なサインです。'],
['SNSの怪しい求人から学生証や身分証の写真を要求されたら？',['すぐに送る','友達の身分証を送る','送らずに応募を止め、信頼できる人に相談する','匿名アプリなら送ってよい'],2,'身分証画像が脅迫や個人情報の悪用に使われるおそれがあります。安易に送らないでください。'],
['闇バイトの募集で「詳しい仕事は別の匿名アプリで説明」と言われた場合は？',['安全性が保証されている','秘密の仕事だから必ず高収入','証拠を残さないようにする意図も疑い、応募しない','アプリを入れれば合法になる'],2,'匿名性の高い連絡手段への誘導は危険な兆候の一つです。仕事内容や募集元を確認できない求人には応じないでください。'],
['怪しい求人に応募してしまい、脅されているときの適切な行動は？',['指示どおり犯罪に参加する','一人で解決するまで誰にも言わない','犯罪に加わる前に警察や家族・先生へ相談する','証拠をすべて消して相手と会う'],2,'犯罪に加わる前に相談しましょう。警察相談専用電話は#9110、差し迫った危険には110番です。'],
['緊急ではない警察への相談に使える番号は？',['#9110','119','117','104'],0,'警察相談専用電話は#9110です。事件・事故などの緊急時は110番に連絡します。'],
['カフェの無料Wi-Fiに接続する前に確認すべきことは？',['名前が似ていれば何でもよい','店員などに正式なWi-Fi名を確認する','最も電波が強いものを必ず選ぶ','パスワード入力を要求する画面はすべて安全'],1,'偽のアクセスポイントに接続しないよう、店舗が案内する正式なWi-Fi名を確認しましょう。'],
['公衆Wi-Fiで偽のログイン画面が表示された場合の危険は？',['端末の画面が明るくなるだけ','個人情報やパスワードを盗まれる可能性','通信速度が必ず速くなる','自動的に安全になる'],1,'偽ログイン画面は、ID・パスワードなどを盗み取るために使われる場合があります。'],
['SNSに写真を投稿する前のチェックとして適切なのは？',['位置情報や住所が写っていないか確認する','友達の顔が写っていても確認不要','情報がウソでも面白ければ投稿する','他人の作品なら自由に使う'],0,'顔、住所、学校名、位置情報などが写っていないか、また他人の権利を侵害しないかを確認しましょう。'],
['SNSでトラブルを防ぐ行動として最も適切なのは？',['見つけた情報は必ずすぐ拡散する','批判されても相手の住所を公開する','投稿前に事実・相手への影響・著作権・個人情報を確認する','鍵付きアカウントならチェックしなくてよい'],2,'投稿前に事実確認、他者への配慮、著作権・個人情報の確認を行うことが重要です。']
];
const root=document.getElementById('questions'),grade=document.getElementById('grade'),retry=document.getElementById('retry'),result=document.getElementById('result');let answers=Array(quiz.length).fill(null),done=false;
function render(){root.innerHTML='';quiz.forEach((q,i)=>{const card=document.createElement('section');card.className='question';const num=document.createElement('div');num.className='num';num.textContent='QUESTION '+String(i+1).padStart(2,'0')+' / 20';card.append(num);const h=document.createElement('h2');h.textContent=q[0];card.append(h);q[1].forEach((option,j)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.checked=answers[i]===j;input.disabled=done;input.addEventListener('change',()=>{answers[i]=j;update()});const span=document.createElement('span');span.textContent=String.fromCharCode(65+j)+'. '+option;label.append(input,span);card.append(label)});root.append(card)});update()}
function update(){const n=answers.filter(a=>a!==null).length;document.getElementById('count').textContent='回答済み '+n+' / 20問';document.getElementById('bar').style.width=n/quiz.length*100+'%';grade.disabled=n!==quiz.length||done;document.getElementById('notice').textContent=done?'採点済みです。下に結果と解説を表示しています。':n===quiz.length?'すべて回答しました。採点できます。':'あと '+(quiz.length-n)+' 問回答してください。'}
grade.addEventListener('click',()=>{if(done||answers.some(a=>a===null))return;done=true;let correct=0;const heading=document.createElement('h2');heading.textContent='採点結果';result.replaceChildren(heading);const score=document.createElement('div');score.className='score';quiz.forEach((q,i)=>{if(answers[i]===q[2])correct++});score.textContent=correct*5+' / 100点';result.append(score);const summary=document.createElement('p');summary.textContent='正解 '+correct+' 問 / 20問（正答率 '+Math.round(correct/20*100)+'%）';result.append(summary);quiz.forEach((q,i)=>{const good=answers[i]===q[2];const item=document.createElement('div');item.className='review'+(good?' correct':'');const title=document.createElement('strong');title.textContent='第'+(i+1)+'問：'+(good?'○ 正解':'× 不正解');const question=document.createElement('p');question.textContent=q[0];const mine=document.createElement('p');mine.textContent='あなたの回答：'+String.fromCharCode(65+answers[i])+'．'+q[1][answers[i]];const right=document.createElement('p');right.textContent='正解：'+String.fromCharCode(65+q[2])+'．'+q[1][q[2]];const explain=document.createElement('p');explain.textContent='解説：'+q[3];item.append(title,question,mine,right,explain);result.append(item)});result.classList.remove('hidden');retry.classList.remove('hidden');render();result.scrollIntoView({behavior:'smooth',block:'start'})});retry.addEventListener('click',()=>{answers=Array(quiz.length).fill(null);done=false;result.classList.add('hidden');retry.classList.add('hidden');render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
